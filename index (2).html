document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

es a hard, offset block shadow, never a blur */\n--shadow-offset:40px 26px 0 0 var(--magda-gray-900);\n--shadow-offset-sm:10px 7px 0 0 var(--magda-gray-900);\n--shadow-offset-brand:10px 7px 0 0 var(--magda-blue-900);\n--shadow-none:none;\n/* Motion */\n--ease-standard:cubic-bezier(.2,.7,.2,1); /* @kind other */\n--dur-fast:120ms; /* @kind other */\n--dur-base:200ms; /* @kind other */\n--dur-slow:360ms; /* @kind other */\n}\n\n/* Magda — minimal element defaults */\nhtml{font-family:var(--font-sans);color:var(--text-body);-webkit-font-smoothing:antialiased}\na{color:var(--text-accent);text-decoration:none}\na:hover{color:var(--action-primary-hover);text-decoration:underline}\n::selection{background:var(--magda-blue-200);color:var(--magda-blue-900)}\n\n<\u002Fstyle>\n  <script src=\"9eeb85bf-3573-4c37-ae3b-b303ded07033\"><\u002Fscript>\n  <script src=\"abd6e12a-5da3-499d-9f9c-f2fe81f33f21\"><\u002Fscript>\n  <style>\n    body{margin:0;background:#FFFFFF;font-family:var(--font-sans);color:var(--text-body)}\n    a{color:var(--action-primary)}a:hover{color:var(--action-primary-hover)}\n    input::placeholder{color:var(--magda-gray-300)}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#FFFFFF;\">\n  <sc-if value=\"{{ showLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-muted);\">Cargando…<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;background:var(--surface-subtle);\">\n      <form sc-camel-on-submit=\"{{ login }}\" style=\"width:100%;max-width:400px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;padding:40px;background:#FFFFFF;box-shadow:10px 7px 0 var(--magda-gray-900);\">\n        <div style=\"width:120px;height:8px;backgro { userLabel }}<\u002Fdiv>\n          <x-import component-from-global-scope=\"MagdaDesignSystem_561b9e.Button\" variant=\"ghost\" size=\"sm\" on-click=\"{{ logout }}\" hint-size=\"120px,36px\">Cerrar sesión<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <div style=\"font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);\">Dentex<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:56px;line-height:1.05;font-weight:400;color:var(--text-display);letter-spacing:-.01em;\">Contenidos para grabar<\u002Fh1>\n          <div style=\"font-size:18px;color:var(--text-subtitle);\">pauta de implantes y reels orgánicos.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;min-width:260px;\">\n          <div style=\"font-size:16px;color:var(--text-body);\"><strong style=\"color:var(--text-accent);\">{{ doneCount }}<\u002Fstrong> de {{ total }} piezas confirmadas<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--text-muted);min-height:18px;\">{{ syncLabel }}<\u002Fdiv>\n          <div style=\"height:6px;background:var(--magda-gray-100);\">\n            <div style=\"height:6px;background:var(--action-primary);width:{{ pct }};transition:width 240ms cubic-bezier(.2,.7,.2,1);\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;\">\n      <x-import component-from-global-scope=\"MagdaDesignSystem_561b9e.Tabs\" items=\"{{ tabs }}\" value=\"{{ filter }}\" on-change=\"{{ setFilter }}\" hint-size=\"420px,44px\"><\u002Fx-import>\n      <div style=\"font-size:14px;color:var(--text-muted);\">{{ helpText }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"overflow-x:auto;\">\n      <div style=\"min-width:1040px;display:flex;flex-direction:column;gap:48px;\">\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <section style=\"display:flex;flex-direction:column;\">\n            <div style=\"display:flex;align-items:center;gap:16px;padding-bottom:16px;\">\n              <h2 style=\"margin:0;font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-heading);white-space:nowrap;\">{{ g.title }}<\u002Fh2>\n              <div style=\"flex:1;height:1px;background:var(--border-rule);\"><\u002Fdiv>\n              <div style=\"font-size:14px;color:var(--text-muted);white-space:nowrap;\">{{ g.summary }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:72px 44px minmax(0,1fr) 110px 220px 170px 120px;gap:16px;align-items:center;padding:10px 12px;background:var(--surface-subtle);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-heading);\">\n              <div>Grabar<\u002Fdiv>\n              <div>N.º<\u002Fdiv>\n              <div>Pieza<\u002Fdiv>\n              <div>Formato<\u002Fdiv>\n              <div>Orador<\u002Fdiv>\n              <div>Fecha de grabación<\u002Fdiv>\n              <div>Estado<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ g.empty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:24px 12px;font-size:15px;color:var(--text-muted);border-bottom:1px solid var(--border-subtle);\">No hay piezas en esta vista.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ g.rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n              <div style=\"border-bottom:1px solid var(--border-subtle);background:{{ row.bg }};transition:background 200ms cubic-bezier(.2,.7,.2,1);\">\n                <div style=\"display:grid;grid-template-columns:72px 44px minmax(0,1fr) 110px 220px 170px 120px;gap:16px;align-items:center;padding:14px 12px;\">\n                  <div style=\"display:flex;align-items:center;\">\n                    <x-import component-from-global-scope=\"MagdaDesignSystem_561b9e.Checkbox\" checked=\"{{ row.done }}\" disabled=\"{{ row.lockDone }}\" on-change=\"{{ row.toggle }}\" hint-size=\"20px,20px\"><\u002Fx-import>\n                  <\u002Fdiv>\n                  <div style=\"font-size:15px;color:var(--text-muted);font-variant-numeric:tabular-nums;\">{{ row.num }}<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ row.toggleOpen }}\" style=\"display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;\">\n                    <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);\">{{ row.angulo }}<\u002Fdiv>\n                    <div style=\"font-size:17px;line-height:1.3;color:var(--text-heading);text-wrap:pretty;\" style-hover=\"color:var(--action-primary);\">{{ row.titulo }}<\u002Fdiv>\n                    <div style=\"font-size:13px;color:var(--text-accent);\">{{ row.openLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <x-import component-from-global-scope=\"MagdaDesignSystem_561b9e.Tag\" tone=\"{{ row.formatoTone }}\" size=\"sm\" hint-size=\"70px,24px\">{{ row.formato }}<\u002Fx-import>\n                  <\u002Fdiv>\n                  <x-import component-from-global-scope=\"MagdaDesignSystem_561b9e.Input\" value=\"{{ row.orador }}\" on-change=\"{{ row.setOrador }}\" placeholder=\"{{ row.oradorPh }}\" hint-size=\"220px,44px\"><\u002Fx-import>\n                  <x-import component-from-global-scope=\"MagdaDesignSystem_561b9e.Input\" type=\"date\" value=\"{{ row.fecha }}\" on-change=\"{{ row.setFecha }}\" hint-size=\"170px,44px\"><\u002Fx-import>\n                  <div>\n                    <x-import component-from-global-scope=\"MagdaDesignSystem_561b9e.Tag\" tone=\"{{ row.estadoTone }}\" size=\"sm\" hint-size=\"90px,24px\">{{ row.estado }}<\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ row.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;padding:8px 12px 28px 148px;\">\n                    <sc-for list=\"{{ row.sections }}\" as=\"s\" hint-placeholder-count=\"2\">\n                      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n                        <div style=\"display:flex;align-items:center;gap:12px;\">\n                          <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtitle);white-space:nowrap;\">{{ s.label }}<\u002Fdiv>\n                          <div style=\"flex:1;height:1px;background:var(--magda-gray-100);\"><\u002Fdiv>\n                        <\u002Fdiv>\n                        <sc-for list=\"{{ s.lines }}\" as=\"line\" hint-placeholder-count=\"3\">\n                          <p style=\"margin:0;font-size:15px;line-height:1.5;color:var(--text-body);text-wrap:pretty;\">{{ line }}<\u002Fp>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SUPABASE_URL = 'https://ycrfaxfhhvurxvkvzpxa.supabase.co';\nconst SUPABASE_KEY = 'sb_publishable_ppj-CgwEhJWSrDN1d54njQ_lq7vb2n9';\nconst DATA = [\n  { group: 'pauta', items: [\n    { id: 'a1a', angulo: 'Ángulo 1 · Diferencial Dentex', titulo: 'Implante inmediato', formato: 'Estática', sections: [\n      { label: 'Copy in', lines: ['¿Te tienen que sacar una pieza?', 'En algunos casos, la extracción y el implante pueden hacerse en el mismo acto.', 'Implante inmediato', '→ menos etapas en el proceso', '→ evaluación previa según cada caso', 'Implantología en Dentex', '📍 Microcentro, CABA', 'Consultanos por WhatsApp'] },\n      { label: 'Copy out', lines: ['Si necesitás extraer una pieza y reemplazarla con un implante, existe una alternativa que puede acortar el proceso.', 'En los casos indicados, en Dentex podemos realizar la extracción y la colocación del implante en el mismo acto. Luego comienza el período de osteointegración y, finalmente, la rehabilitación con la corona.', 'Cada caso requiere evaluación previa.', '📲 Escribinos al +54 9 11 6847-4967 para coordinar una consulta.'] } ] },\n    { id: 'a1b', angulo: 'Ángulo 1 · Diferencial Dentex', titulo: 'Corona digital', formato: 'Estática', sections: [\n      { label: 'Copy in', lines: ['Una semana.', 'Eso puede tardar en estar lista tu corona digital.', 'En Dentex la fabricamos a partir de un escaneo digital.', 'Más precisión.', 'Más eficiencia. Todo dentro del mismo tratamiento.', 'Corona digital en una semana.', '📍 Dentex · Microcentro'] },\n      { label: 'Copy out', lines: ['Hay partes de un tratamiento odontológico que hoy pueden resolverse de otra manera.', 'En Dentex trabajamos con escaneo y fabricación digital de coronas, lo que permite tener tu corona lista en una semana.', 'Y si tu tratamiento requiere implantes o una rehabilitación más compleja, podemos realizar todo el proceso dentro de la clínica, sin derivaciones.', '📲 Consultanos por WhatsApp al +54 9 11 6847-4967.'] } ] },\n    { id: 'a2a', angulo: 'Ángulo 2 · Me falta una pieza', titulo: 'Opciones de tratamiento', formato: 'Estática', sections: [\n      { label: 'Copy in', lines: ['Te falta un diente.', '¿Implante, corona o prótesis?', 'Cada caso necesita una solución distinta.', 'En Dentex evaluamos tu boca y te indicamos la alternativa adecuada para recuperar la pieza.', 'Primero el diagnóstico.', 'Después, el tratamiento.', '📍 Microcentro, CABA', 'Coordiná tu evaluación.'] },\n      { label: 'Copy out', lines: ['Hay muchas formas de reemplazar un diente. Depende del estado de la pieza, del hueso y de las necesidades de cada paciente.', 'Lo importante es que hay distintas alternativas de rehabilitación si evaluás tu caso a tiempo.', 'En Dentex contamos con rehabilitaciones completas sin necesidad de derivación. Podés hacerte todo el tratamiento en la misma clínica.', '📲 Escribinos por WhatsApp al +54 9 11 6847-4967 y coordiná una primera consulta.'] } ] },\n    { id: 'a2b', angulo: 'Ángulo 2 · Me falta una pieza', titulo: 'Evaluación', formato: 'Carrusel', sections: [\n      { label: 'Copy in', lines: ['Placa 1 — ¿Qué hay que evaluar para saber cómo reemplazar un diente?', 'Placa 2 — El estado de la pieza. Para saber qué tipo de rehabilitación necesitás.', 'Placa 3 — El hueso. Su cantidad y condiciones también definen qué alternativas son posibles.', 'Placa 4 — El tratamiento indicado para tu caso. Implante, corona o prótesis: la elección depende de una evaluación personalizada.', 'Placa 5 — En Dentex podés hacer todo el tratamiento en la misma clínica, sin derivaciones. Y si necesitás una corona, trabajamos con fabricación digital vía escáner: tu corona puede estar lista en una semana.', '📍 Microcentro, CABA', 'Coordiná tu evaluación.'] },\n      { label: 'Copy out', lines: ['Cuando falta una pieza, primero hay que evaluar cuál es la mejor forma de reemplazarla.', 'El estado de la pieza, el hueso y las necesidades de cada paciente son parte de esa decisión.', 'En Dentex realizamos rehabilitaciones completas sin derivación, para que puedas hacer todo el tratamiento en la misma clínica.', 'Además, si tu tratamiento requiere una corona, trabajamos con fabricación digital vía escáner y puede estar lista en una semana.', '📍 Microcentro, CABA', '📲 Escribinos al +54 9 11 6847-4967 para coordinar una consulta.'] } ] },\n    { id: 'a3a', angulo: 'Ángulo 3 · Dudas sobre el implante', titulo: 'Proceso del implante', formato: 'Reel', sections: [\n      { label: 'Guion', lines: ['¿Te cuesta sonreír porque te falta una pieza?', 'Si lo que te frena es pensar en el procedimiento, hoy existen técnicas mínimamente invasivas para un postoperatorio más llevadero.', 'Y si te dijeron que quizás no tenés suficiente hueso, eso también se evalúa de forma personalizada. Puede haber alternativas según tu caso.', '¿Cómo es el proceso? Primero hacemos una evaluación y planificación. Si es necesario, realizamos la colocación del implante, la osteointegración y, posteriormente, la rehabilitación con la corona', 'En Dentex hacemos rehabilitaciones completas en la misma clínica, sin derivaciones.', 'Estamos en Microcentro, CABA', 'Coordiná tu evaluación.'] },\n      { label: 'Copy out', lines: ['Si te falta una pieza y estás pensando en reemplazarla con un implante, es normal que aparezcan preguntas sobre el procedimiento o sobre si tu caso es apto.', 'En Dentex trabajamos con planificación digital, técnicas mínimamente invasivas y una evaluación personalizada de cada paciente. Si hay poco hueso, analizamos qué alternativas existen antes de definir el tratamiento.', 'Además, realizamos rehabilitaciones completas sin derivación, para que puedas hacer todo el proceso en la misma clínica.', '📲 Escribinos por WhatsApp al +54 9 11 6847-4967 y coordiná una primera consulta.'] } ] },\n    { id: 'a3b', angulo: 'Ángulo 3 · Dudas sobre el implante', titulo: 'Dolor y falta de hueso', formato: 'Reel', sections: [\n      { label: 'Guion', lines: ['¿Te dijeron que ponerte un implante es doloroso o que no podés porque te falta hueso?', 'En Dentex trabajamos con planificación digital que permite trabajar con mayor precisión y realizar técnicas mínimamente invasivas, haciendo más llevadero el postoperatorio.', 'Y según el caso, incluso puede realizarse la extracción y el implante en el mismo acto.', 'Escribinos por WhatsApp para coordinar un turno y evaluar tu caso.'] },\n      { label: 'Copy out', lines: ['El miedo al procedimiento y la falta de hueso son dos de las dudas más frecuentes antes de un implante.', 'En Dentex evaluamos cada caso de forma personalizada y trabajamos con planificación digital para definir el tratamiento adecuado. Las técnicas actuales son mínimamente invasivas y permiten un postoperatorio más llevadero que con procedimientos anteriores.', 'Además, cuando las condiciones lo permiten, la extracción y la colocación del implante pueden realizarse en el mismo acto, reduciendo una etapa del proceso.', '📲 Escribinos por WhatsApp al +54 9 11 6847-4967 y coordiná una evaluación.'] } ] },\n    { id: 'a4a', angulo: 'Ángulo 4 · Precios', titulo: '¿Cuánto sale un implante?', formato: 'Reel', sections: [\n      { label: 'Guion', lines: ['¿Cuánto sale un implante? Hay más de una opción.', 'En Dentex trabajamos con implantes nacionales e importados, para evaluar alternativas según cada caso y presupuesto.', 'Tenemos opciones de financiación y hacemos evaluaciones personalizadas.', 'Escribinos por WhatsApp para coordinar una primera consulta.', 'Estamos en Esmeralda 920, Microcentro'] },\n      { label: 'Copy out', lines: ['El precio es una de las primeras preguntas cuando alguien empieza a averiguar por implantes.', 'En Dentex trabajamos con opciones nacionales e importadas y distintas alternativas de financiación, para poder evaluar qué tratamiento se adapta mejor a cada caso y presupuesto.', '📲 Escribinos al +54 9 11 6847-4967 para coordinar una consulta.'] } ] },\n    { id: 'a4b', angulo: 'Ángulo 4 · Precios', titulo: '¿Reponer una pieza es muy costoso?', formato: 'Reel', sections: [\n      { label: 'Guion', lines: ['¿Creés que reponer una pieza dental es muy costoso?', 'En implantes, no existe una única alternativa.', 'Trabajamos con opciones nacionales e importadas. Y contamos con alternativas de financiación.', 'Evaluamos tu caso y te mostramos qué opciones existen para vos.', 'Estamos en Microcentro', 'Escribinos por WhatsApp para coordinar una primera consulta.'] },\n      { label: 'Copy out', lines: ['Hay personas que postergan un implante durante meses porque asumen que no van a poder pagarlo.', 'Por eso, además de evaluar qué tratamiento necesitás, en Dentex podemos mostrarte distintas alternativas de implantes y opciones de financiación.', '📍 Microcentro, CABA', '📲 Escribinos al +54 9 11 6847-4967 y consultá por tu caso.'] } ] },\n  ] },\n  { group: 'reels', items: [\n    { id: 'osvaldo', angulo: 'Noticia', titulo: 'Reel noticia Osvaldo', formato: 'Reel', sections: [\n      { label: 'Guion', lines: ['Gancho — ¿Sabías que a Daniel Osvaldo una caries casi le cuesta la vida? Sí, como escuchaste: según contó él mismo, ahí empezó todo lo que lo llevó a terapia intensiva.', 'Contexto — La infección le llegó al pulmón. Lo tuvieron que operar y le sacaron la pieza. Texto: \"Según relató Osvaldo\"', 'Cómo puede pasar — Una caries que no se trata no se queda quieta. Atraviesa el esmalte, después la dentina, y llega a la pulpa, que es el nervio del diente. Ahí las bacterias encuentran una puerta de entrada. Se puede formar un absceso y, en casos poco frecuentes, la infección se puede extender a otras partes del cuerpo.', 'Visual: el odontólogo señala un modelo de diente o una radiografía. Sirve la iconografía de las etapas de la caries del brainstorm.', 'Bajada a tierra — No es para asustarse: son casos poco comunes. Pero muestra algo que a veces olvidamos: la boca no está separada del resto del cuerpo. Y una caries detectada a tiempo se resuelve con un arreglo simple.', 'Cierre + CTA — Si hace mucho que no te hacés un control, este es el momento. En Dentex la primera consulta es sin cargo. Y a Dani, le deseamos una pronta recuperación. Texto: Escribinos por WhatsApp (link en la bio)'] },\n      { label: 'Caption en IG', lines: ['Lo que le pasó a Daniel Osvaldo tiene una lección que va más allá del fútbol: una caries sin tratar puede complicarse más de lo que pensamos. Te contamos cómo y qué señales mirar 🦷'] } ] },\n    { id: 'edades', angulo: 'Trend', titulo: 'Reel trend edades', formato: 'Reel', oradorPh: 'Dos profesionales (P1 y P2)', sections: [\n      { label: 'Guion', lines: ['Setup: Dos profesionales frente a frente. Cada uno le pega al otro un cartel en la frente: uno dice 5, el otro 64. Ronda: alternan preguntas', 'P1 (el de 5): ¿A esta edad es esperable que tenga todos los dientes de leche? P2: Sí, todos.', 'P2 (el de 65): ¿A esta edad tengo muelas de juicio? P1: Mmm… seguramente ya te las sacaron.', 'P1: ¿Ya se me cayó algún diente? P2: Probablemente todavía no, pero falta poquito.', 'P2: ¿Yo tengo todos mis dientes? P1: Depende… ¿te hiciste los controles? (ríe)', 'P1: ¿Ya me salió sí o sí la famosa muela de los 6? P2: No es tan exacta pero puede que todavía no.', 'P2: ¿Me tengo que preocupar por las encías? P1: Más que nunca.', 'Resolución (35–45 s) — P1: Arriesgo… P2: ¿ya? P1: ¡Sí, creo que lo tengo! Tengo 5 → se saca el cartel. P2: Jaja, ¡sí! Yo, eh… ¿68? → se saca el cartel. P1: ¡Casi!', 'P2 (a cámara): Yo le erré porque a los 5, todas las bocas se parecen. A los 65, tu boca depende de cómo la cuidaste los 60 años anteriores.', 'P1: Escribinos por WhatsApp y reservá tu turno.'] },\n      { label: 'Caption en IG', lines: ['A los 5 se adivina fácil, a los 65 ya no tanto 😅 Tu sonrisa del futuro depende de lo que hagas hoy. ¿Vos habrías adivinado? 👇🦷'] },\n      { label: 'Referencias', lines: ['https://www.instagram.com/reel/DdFahtuuPHY/', 'https://www.instagram.com/reel/DcgxOm6SmZP/'] } ] },\n  ] },\n];\nconst TITLES = { pauta: 'Pauta · Implantes', reels: 'Reels orgánicos' };\nconst TONES = { Reel: 'brand', 'Estática': 'neutral', Carrusel: 'soft' };\n\nclass Component extends DCLogic {\n  state = { filter: 'todas', done: {}, orador: {}, fecha: {}, open: {}, phase: 'loading', rol: null, email: '', password: '', loginError: '', busy: false, sync: '' };\n  timers = {};\n  componentDidMount() {\n    const start = () => {\n      if (!window.supabase || !window.supabase.createClient) return setTimeout(start, 50);\n      this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);\n      this.sb.auth.getSession().then(({ data }) => data.session ? this.load(data.session) : this.setState({ phase: 'login' }));\n      this.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') this.reset(); });\n    };\n    start();\n  }\n  componentWillUnmount() { if (this.channel) this.sb.removeChannel(this.channel); }\n  reset() {\n    if (this.channel) { this.sb.removeChannel(this.channel); this.channel = null; }\n    this.setState({ phase: 'login', rol: null, done: {}, orador: {}, fecha: {}, password: '', sync: '' });\n  }\n  apply(p, d, o, f) { d[p.id] = !!p.confirmada; o[p.id] = p.orador || ''; f[p.id] = p.fecha_grabacion || ''; }\n  async load(session) {\n    this.setState({ phase: 'loading' });\n    const [{ data: perfil }, { data: piezas, error }] = await Promise.all([\n      this.sb.from('perfiles').select('rol').eq('id', session.user.id).maybeSingle(),\n      this.sb.from('piezas').select('id, confirmada, orador, fecha_grabacion'),\n    ]);\n    if (error || !perfil) {\n      await this.sb.auth.signOut();\n      return this.setState({ phase: 'login', loginError: perfil ? 'No pudimos cargar los datos.' : 'Este usuario no tiene un rol asignado.' });\n    }\n    const done = {}, orador = {}, fecha = {};\n    (piezas || []).forEach(p => this.apply(p, done, orador, fecha));\n    this.setState({ phase: 'app', rol: perfil.rol, email: session.user.email, done, orador, fecha });\n    this.channel = this.sb.channel('piezas-cambios')\n      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'piezas' }, ({ new: p }) => {\n        if (Object.keys(this.timers).some(k => k.startsWith(p.id + ':'))) return;\n        this.setState(s => { const d = { ...s.done }, o = { ...s.orador }, f = { ...s.fecha }; this.apply(p, d, o, f); return { done: d, orador: o, fecha: f }; });\n      })\n      .subscribe();\n  }\n  push(id, field, value, delay = 0) {\n    const k = id + ':' + field;\n    clearTimeout(this.timers[k]);\n    this.setState({ sync: 'Guardando…' });\n    this.timers[k] = setTimeout(async () => {\n      const { error } = await this.sb.from('piezas').update({ [field]: value }).eq('id', id);\n      delete this.timers[k];\n      this.setState({ sync: error ? 'No se pudo guardar. Revisá la conexión.' : 'Cambios guardados' });\n    }, delay);\n  }\n  login = async e => {\n    if (e && e.preventDefault) e.preventDefault();\n    if (!this.sb) return;\n    this.setState({ busy: true, loginError: '' });\n    const { data, error } = await this.sb.auth.signInWithPassword({ email: this.state.email.trim(), password: this.state.password });\n    this.setState({ busy: false });\n    if (error) return this.setState({ loginError: 'Email o contraseña incorrectos.' });\n    this.load(data.session);\n  };\n  logout = () => { if (this.sb) this.sb.auth.signOut(); };\n  renderVals() {\n    const { filter, done, orador, fecha, open, rol, phase } = this.state;\n    const esMagda = rol === 'magda';\n    const all = DATA.flatMap(g => g.items);\n    const total = all.length;\n    const doneCount = all.filter(i => done[i.id]).length;\n    let n = 0;\n    const groups = DATA.map(g => {\n      const rows = g.items.map(it => {\n        n += 1;\n        const d = !!done[it.id], o = !!open[it.id];\n        return {\n          num: String(n).padStart(2, '0'), angulo: it.angulo, titulo: it.titulo, formato: it.formato,\n          formatoTone: TONES[it.formato] || 'neutral', sections: it.sections,\n          done: d, open: o, openLabel: o ? 'Ocultar contenido' : 'Ver contenido',\n          estado: d ? 'Confirmada' : 'Pendiente', estadoTone: d ? 'solid' : 'neutral',\n          bg: d ? 'var(--surface-subtle)' : '#FFFFFF',\n          orador: orador[it.id] || '', oradorPh: it.oradorPh || 'Asignar orador',\n          lockDone: !esMagda,\n          toggle: v => { if (!esMagda) return; this.setState(s => ({ done: { ...s.done, [it.id]: v } })); this.push(it.id, 'confirmada', v); },\n          setOrador: v => { this.setState(s => ({ orador: { ...s.orador, [it.id]: v } })); this.push(it.id, 'orador', v, 600); },\n          fecha: fecha[it.id] || '',\n          setFecha: v => { this.setState(s => ({ fecha: { ...s.fecha, [it.id]: v } })); this.push(it.id, 'fecha_grabacion', v || null); },\n          toggleOpen: () => this.setState(s => ({ open: { ...s.open, [it.id]: !s.open[it.id] } })),\n        };\n      });\n      const visible = rows.filter(r => filter === 'todas' || (filter === 'confirmadas' ? r.done : !r.done));\n      const gd = rows.filter(r => r.done).length;\n      return { title: TITLES[g.group], rows: visible, empty: visible.length === 0, summary: gd + ' de ' + rows.length + ' confirmadas' };\n    });\n    return {\n      showLoading: phase === 'loading', showLogin: phase === 'login', showApp: phase === 'app',\n      email: this.state.email, password: this.state.password,\n      setEmail: v => this.setState({ email: v }), setPassword: v => this.setState({ password: v }),\n      login: this.login, logout: this.logout, busy: this.state.busy,\n      loginLabel: this.state.busy ? 'Ingresando…' : 'Ingresar',\n      loginError: this.state.loginError, hasError: !!this.state.loginError,\n      userLabel: (esMagda ? 'Magda' : 'Dentex') + ' · ' + this.state.email,\n      syncLabel: this.state.sync,\n      helpText: esMagda ? 'Tocá el nombre de una pieza para ver el guion y los copys.' : 'Completá orador y fecha. Las confirmaciones las marca Magda.',\n      total, doneCount, pct: (total ? Math.round(doneCount / total * 100) : 0) + '%',\n      filter, groups,\n      tabs: [\n        { value: 'todas', label: 'Todas (' + total + ')' },\n        { value: 'pendientes', label: 'Pendientes (' + (total - doneCount) + ')' },\n        { value: 'confirmadas', label: 'Confirmadas (' + doneCount + ')' },\n      ],\n      setFilter: v => this.setState({ filter: v }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

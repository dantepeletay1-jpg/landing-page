  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0px,5vw,72px)\">\n<p ref=\"{{ prPhraseRef }}\" style=\"margin:0;max-width:16ch;text-align:center;font-family:'Red Hat Display',system-ui,sans-serif;font-weight:400;font-size:clamp(2.2rem,min(5.4vw,8.4vh),6rem);line-height:1.16;letter-spacing:-.02em;color:#d8cfc6;transform-origin:50% 0;will-change:transform\">\n<span data-w=\"\">Tratamiento<\u002Fspan> <span data-w=\"\">de<\u002Fspan> <span data-w=\"\" data-acc=\"oxido\" style=\"font-style:italic\">alta<\u002Fspan> <span data-w=\"\" data-acc=\"oxido\" style=\"font-style:italic\">complejidad,<\u002Fspan> <span data-w=\"\" data-acc=\"oxido\" style=\"font-style:italic\">sin<\u002Fspan> <span data-w=\"\" data-acc=\"oxido\" style=\"font-style:italic\">demoras,<\u002Fspan> <span data-w=\"\">con<\u002Fspan> <span data-w=\"\" data-acc=\"oxido\" style=\"font-style:italic\">revisión<\u002Fspan> <span data-w=\"\" data-acc=\"oxido\" style=\"font-style:italic\">colegiada<\u002Fspan> <span data-w=\"\">y<\u002Fspan> <span data-w=\"\">una<\u002Fspan> <span data-w=\"\">persona<\u002Fspan> <span data-w=\"\">que<\u002Fspan> <span data-w=\"\" data-acc=\"naranja\" style=\"font-style:italic\">te<\u002Fspan> <span data-w=\"\" data-acc=\"naranja\" style=\"font-style:italic\">acompaña<\u002Fspan> <span data-w=\"\">de<\u002Fspan> <span data-w=\"\">principio<\u002Fspan> <span data-w=\"\">a<\u002Fspan> <span data-w=\"\">fin.<\u002Fspan>\n<\u002Fp>\n<\u002Fdiv>\n<div ref=\"{{ prCardsLayerRef }}\" class=\"pr-cards-layer\" style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 0 clamp(20px,5vw,72px) clamp(24px,5vh,56px); top: 550.71px\">\n<div style=\"max-width:1200px;margin:0 auto;display:grid;gap:clamp(18px,3vh,32px)\">\n<div class=\"pr-cards\" style=\"display:grid;gap:20px\">\n<div data-card=\"\" style=\"position:relative;display:grid;will-change:transform,opacity\">\n<article class=\"pc\" style=\"position:relative;box-sizing:border-box;background:rgba(255,255,255,.72);border-radius:28px;padding:clamp(22px,3.2vh,30px) 26px;display:g r el inicio de tu tratamiento.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<div data-card=\"\" style=\"position:relative;display:grid;will-change:transform,opacity\">\n<article class=\"pc\" style=\"position:relative;box-sizing:border-box;background:rgba(255,255,255,.72);border-radius:28px;padding:clamp(22px,3.2vh,30px) 26px;display:grid;gap:10px;align-content:start;box-shadow:0 0 0 1px rgba(101,81,70,.08),0 1px 2px rgba(49,20,14,.04),0 14px 36px -16px rgba(49,20,14,.16);transition:transform 600ms cubic-bezier(.22,1,.36,1),box-shadow 600ms cubic-bezier(.22,1,.36,1)\" style-hover=\"transform:translateY(-4px);box-shadow:0 0 0 1px rgba(101,81,70,.08),0 2px 4px rgba(49,20,14,.04),0 24px 48px -18px rgba(49,20,14,.22)\">\n<span data-orbit=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none\"><\u002Fspan>\n\n<h3 style=\"position:relative;margin:0;font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.015em;color:#31140e\">Revisión colegiada<\u002Fh3>\n<p style=\"position:relative;margin:0;font-size:15px;line-height:1.55;color:#655146\">Tu indicación se discute en comité de tumores. Ningún caso depende del criterio de una sola persona, y tu médico derivador puede participar.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<div data-card=\"\" style=\"position:relative;display:grid;will-change:transform,opacity\">\n<article class=\"pc\" style=\"position:relative;box-sizing:border-box;background:rgba(255,255,255,.72);border-radius:28px;padding:clamp(22px,3.2vh,30px) 26px;display:grid;gap:10px;align-content:start;box-shadow:0 0 0 1px rgba(101,81,70,.08),0 1px 2px rgba(49,20,14,.04),0 14px 36px -16px rgba(49,20,14,.16);transition:transform 600ms cubic-bezier(.22,1,.36,1),box-shadow 600ms cubic-bezier(.22,1,.36,1)\" style-hover=\"transform:translateY(-4px);box-shadow:0 0 0 1px rgba(101,81,70,.08),0 2px 4px rgba(49,20,14,.04),0 24px 48px -18px rgba(49,20,14,.22)\">\n<span data-orbit=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none\"><\u002Fspan>\n\n<h3 style=\"position:relative;margin:0;font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.015em;color:#31140e\">Una persona de principio a fin<\u002Fh3>\n<p style=\"position:relative;margin:0;font-size:15px;line-height:1.55;color:#655146\">Tu Referente del Paciente te explica el tratamiento, gestiona la autorización, coordina los turnos y resuelve las dudas no médicas.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tratamientos\" ref=\"{{ txRef }}\" data-nav=\"light\" aria-label=\"Tratamientos\" class=\"{{ txClass }}\" style=\"position: relative\">\n<div class=\"tx-intro\" style=\"padding: clamp(120px,18vh,200px) clamp(20px,5vw,72px) clamp(40px,8vh,96px)\">\n<div style=\"max-width:1200px;margin:0 auto;display:grid;gap:22px\">\n\n<h2 data-tx-c=\"title\" style=\"margin:0;font-size:clamp(2.25rem,4.6vw,4.25rem);line-height:1.03;letter-spacing:-.03em;font-weight:600;color:#31140e;max-width:20ch;text-wrap:balance\">Todas las técnicas de la radioterapia de alta complejidad, desde el primer día.<\u002Fh2>\n<p data-tx-c=\"lede\" style=\"margin:0;font-size:clamp(1.0625rem,1.45vw,1.3125rem);line-height:1.55;color:#655146;max-width:54ch;text-wrap:pretty\">Nuestra tecnología permite tratar con mayor exactitud, proteger el tejido sano y verificar tu posición antes de cada sesión. Según la indicación médica, también permite realizar el tratamiento en menos sesiones.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div ref=\"{{ txPinRef }}\" class=\"tx-pin\">\n<div class=\"tx-sticky\">\n<div class=\"tx-grid\">\n<div class=\"tx-stage\" style=\"display:grid;place-items:center;height:100%;min-width:0;padding-right:clamp(24px,3vw,48px);box-sizing:border-box\">\n<div ref=\"{{ txStageRef }}\" aria-hidden=\"true\" style=\"width:min(100%,66vh);aspect-ratio:1;overflow:hidden\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"tx-right\" style=\"position:relative;height:100%;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(180deg,transparent,#000 24%,#000 76%,transparent)\">\n<div class=\"tx-rail\" aria-hidden=\"true\" style=\"position:absolute;left:8px;top:50%;width:28px;height:196px;margin-top:-98px;z-index:2\">\n<span style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;margin-left:-.5px;background:rgba(249,246,239,.18)\"><\u002Fspan>\n<span style=\"position:absolute;left:50%;top:0px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(249,246,239,.4)\"><\u002Fspan><span style=\"position:absolute;left:50%;top:28px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(249,246,239,.4)\"><\u002Fspan><span style=\"position:absolute;left:50%;top:56px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(249,246,239,.4)\"><\u002Fspan><span style=\"position:absolute;left:50%;top:84px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(249,246,239,.4)\"><\u002Fspan><span style=\"position:absolute;left:50%;top:112px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(249,246,239,.4)\"><\u002Fspan><span style=\"position:absolute;left:50%;top:140px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(249,246,239,.4)\"><\u002Fspan><span style=\"position:absolute;left:50%;top:168px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(249,246,239,.4)\"><\u002Fspan><span style=\"position:absolute;left:50%;top:196px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(249,246,239,.4)\"><\u002Fspan>\n<span ref=\"{{ txBubbleRef }}\" data-glass=\"dark\" style=\"position:absolute;left:0;top:0;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:rgba(249,246,239,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);display:grid;place-items:center;will-change:transform\"><span style=\"width:8px;height:8px;border-radius:50%;background:#e24c21;box-shadow:0 0 12px rgba(226,76,33,.6)\"><\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div ref=\"{{ txListRef }}\" class=\"tx-list\" style=\"position:absolute;left:0;right:0;top:0;will-change:transform\">\n<article data-tx=\"0\" class=\"tx-item\" style=\"display:grid;gap:14px;align-content:start;padding:7vh 0 7vh 64px;box-sizing:border-box\">\n<div data-tx-ill=\"0\" class=\"tx-ill\" aria-hidden=\"true\"><\u002Fdiv>\n<span style=\"font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e24c21\">3D-CRT<\u002Fspan>\n<h3 style=\"margin:0;font-size:clamp(28px,2.7vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.025em;color:#f9f6ef;max-width:18ch;text-wrap:balance\">Radioterapia conformada tridimensional<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(249,246,239,.74);max-width:42ch;text-wrap:pretty\">A partir de la tomografía de simulación se reconstruye la forma exacta del tumor y de los órganos vecinos, y los campos se ajustan a ese volumen.<\u002Fp>\n<\u002Farticle>\n<article data-tx=\"1\" class=\"tx-item\" style=\"display:grid;gap:14px;align-content:start;padding:7vh 0 7vh 64px;box-sizing:border-box\">\n<div data-tx-ill=\"1\" class=\"tx-ill\" aria-hidden=\"true\"><\u002Fdiv>\n<span style=\"font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e24c21\">IMRT · VMAT<\u002Fspan>\n<h3 style=\"margin:0;font-size:clamp(28px,2.7vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.025em;color:#f9f6ef;max-width:18ch;text-wrap:balance\">Intensidad modulada por arcoterapia volumétrica<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(249,246,239,.74);max-width:42ch;text-wrap:pretty\">La intensidad del haz varía mientras el equipo gira a tu alrededor. La dosis se adapta a la forma del tumor y se reduce la exposición de los tejidos sanos.<\u002Fp>\n<\u002Farticle>\n<article data-tx=\"2\" class=\"tx-item\" style=\"display:grid;gap:14px;align-content:start;padding:7vh 0 7vh 64px;box-sizing:border-box\">\n<div data-tx-ill=\"2\" class=\"tx-ill\" aria-hidden=\"true\"><\u002Fdiv>\n<span style=\"font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e24c21\">IGRT<\u002Fspan>\n<h3 style=\"margin:0;font-size:clamp(28px,2.7vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.025em;color:#f9f6ef;max-width:18ch;text-wrap:balance\">Radioterapia guiada por imágenes<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(249,246,239,.74);max-width:42ch;text-wrap:pretty\">Los órganos internos no ocupan la misma posición todos los días. Antes de cada sesión obtenemos imágenes, las comparamos con la planificación y corregimos tu posición.<\u002Fp>\n<\u002Farticle>\n<article data-tx=\"3\" class=\"tx-item\" style=\"display:grid;gap:14px;align-content:start;padding:7vh 0 7vh 64px;box-sizing:border-box\">\n<div data-tx-ill=\"3\" class=\"tx-ill\" aria-hidden=\"true\"><\u002Fdiv>\n<span style=\"font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e24c21\">SBRT<\u002Fspan>\n<h3 style=\"margin:0;font-size:clamp(28px,2.7vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.025em;color:#f9f6ef;max-width:18ch;text-wrap:balance\">Radioterapia estereotáxica corporal<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(249,246,239,.74);max-width:42ch;text-wrap:pretty\">Dosis altas y muy precisas sobre lesiones pequeñas, en pocas sesiones. Menos concurrencias al centro y menor interferencia con tu vida cotidiana.<\u002Fp>\n<\u002Farticle>\n<article data-tx=\"4\" class=\"tx-item\" style=\"display:grid;gap:14px;align-content:start;padding:7vh 0 7vh 64px;box-sizing:border-box\">\n<div data-tx-ill=\"4\" class=\"tx-ill\" aria-hidden=\"true\"><\u002Fdiv>\n<span style=\"font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e24c21\">SRS · SRT<\u002Fspan>\n<h3 style=\"margin:0;font-size:clamp(28px,2.7vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.025em;color:#f9f6ef;max-width:18ch;text-wrap:balance\">Radiocirugía y radioterapia estereotáxica intracraneal<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(249,246,239,.74);max-width:42ch;text-wrap:pretty\">Pese a su nombre, la radiocirugía no es una cirugía: no hay incisión, anestesia general ni internación. Es radiación dirigida con precisión submilimétrica.<\u002Fp>\n<\u002Farticle>\n<article data-tx=\"5\" class=\"tx-item\" style=\"display:grid;gap:14px;align-content:start;padding:7vh 0 7vh 64px;box-sizing:border-box\">\n<div data-tx-ill=\"5\" class=\"tx-ill\" aria-hidden=\"true\"><\u002Fdiv>\n<span style=\"font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e24c21\">Braquiterapia<\u002Fspan>\n<h3 style=\"margin:0;font-size:clamp(28px,2.7vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.025em;color:#f9f6ef;max-width:18ch;text-wrap:balance\">Irradiación desde el interior<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(249,246,239,.74);max-width:42ch;text-wrap:pretty\">La fuente de radiación se coloca dentro o junto al tejido a tratar, lo que concentra la dosis en el sitio y protege los órganos vecinos.<\u002Fp>\n<\u002Farticle>\n<article data-tx=\"6\" class=\"tx-item\" style=\"display:grid;gap:14px;align-content:start;padding:7vh 0 7vh 64px;box-sizing:border-box\">\n<div data-tx-ill=\"6\" class=\"tx-ill\" aria-hidden=\"true\"><\u002Fdiv>\n<span style=\"font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e24c21\">DIBH<\u002Fspan>\n<h3 style=\"margin:0;font-size:clamp(28px,2.7vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.025em;color:#f9f6ef;max-width:18ch;text-wrap:balance\">Control respiratorio con protección cardíaca<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(249,246,239,.74);max-width:42ch;text-wrap:pretty\">En determinados tratamientos, una inspiración sostenida aleja el corazón del área a irradiar. Te enseñamos la técnica antes de empezar.<\u002Fp>\n<\u002Farticle>\n<article data-tx=\"7\" class=\"tx-item\" style=\"display:grid;gap:14px;align-content:start;padding:7vh 0 7vh 64px;box-sizing:border-box\">\n<div data-tx-ill=\"7\" class=\"tx-ill\" aria-hidden=\"true\"><\u002Fdiv>\n<span style=\"font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e24c21\">TBI<\u002Fspan>\n<h3 style=\"margin:0;font-size:clamp(28px,2.7vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.025em;color:#f9f6ef;max-width:18ch;text-wrap:balance\">Irradiación corporal total y técnicas especiales<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(249,246,239,.74);max-width:42ch;text-wrap:pretty\">Según protocolo y derivación, para indicaciones específicas que requieren tratar todo el cuerpo de manera controlada.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"tx-note\" style=\"padding:clamp(40px,8vh,88px) clamp(20px,5vw,72px) clamp(88px,12vw,140px)\">\n<p style=\"margin:0 auto;max-width:1200px;font-size:14px;line-height:1.6;color:rgba(249,246,239,.62);border-top:1px solid rgba(249,246,239,.16);padding-top:20px\"><span style=\"display: block; font-size: 16px\">La indicación de cada técnica es una decisión médica individual, que se toma según el tipo y el estadio del tumor, su localización y tu situación clínica. <br>También tratamos indicaciones benignas propias de la especialidad. Esta información orienta; no reemplaza la consulta con el médico especialista.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"recorrido\" ref=\"{{ rcRef }}\" data-nav=\"dark\" aria-label=\"El recorrido\" class=\"{{ rcClass }}\" style=\"position: relative; background-color: #333333\">\n<div class=\"rc-pin\">\n<div class=\"rc-sticky\">\n<span ref=\"{{ rcBgRef }}\" aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;left:-30%;right:-30%;opacity:.035;background-image:url(&quot;0cd1427e-be1a-4634-a9b8-677df0b2c297&quot;);background-size:180px auto;background-repeat:repeat;filter:grayscale(1) brightness(4);will-change:transform;pointer-events:none\"><\u002Fspan>\n<div class=\"rc-head\" style=\"position:relative;padding:clamp(104px,15vh,150px) clamp(20px,5vw,72px) 0\">\n<div class=\"rc-headgrid\" style=\"max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:32px;align-items:end\">\n<div style=\"display:grid;gap:18px\">\n\n<h2 style=\"margin: 0; font-size: clamp(2.1rem,min(4.4vw,7.4vh),4.25rem); line-height: 1.03; letter-spacing: -.03em; font-weight: 400; color: #f9f6ef; max-width: 22ch; text-wrap: balance\" data-mrv=\"\">El recorrido, <br>paso a paso, <br>para que sepas <br>qué esperar en cada etapa.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin:0;justify-self:end;text-align:right;font-family:'Red Hat Display',system-ui,sans-serif;font-style:italic;font-weight:400;font-size:clamp(1.3rem,1.9vw,1.9rem);line-height:1.2;color:#efbfb6;max-width:16ch;text-wrap:balance\">Nada se da por supuesto y todo se comprueba.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rc-viewport\" style=\"position:relative;min-height:0;display:flex;align-items:center\">\n<div ref=\"{{ rcTrackRef }}\" class=\"rc-track\" style=\"position:relative;display:flex;gap:6vw;padding:0 45vw 0 clamp(20px,5vw,72px);width:max-content;will-change:transform\">\n<div ref=\"{{ rcSvgRef }}\" class=\"rc-svg\" aria-hidden=\"true\" style=\"position:absolute;left:0;top:0;height:100px;pointer-events:none\"><\u002Fdiv>\n<span class=\"rc-vline\" aria-hidden=\"true\" style=\"display:none;position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:rgba(249,246,239,.2)\"><span ref=\"{{ rcVFillRef }}\" style=\"position:absolute;left:0;top:0;width:1px;height:100%;background:#de7e6e;transform-origin:0 0;transform:scaleY(0)\"><\u002Fspan><\u002Fspan>\n<span ref=\"{{ rcElRef }}\" aria-hidden=\"true\" style=\"position:absolute;left:0;top:0;width:0;height:0;z-index:2;will-change:transform\">\n<span style=\"position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,rgba(226,76,33,.55),rgba(226,76,33,0) 70%)\"><\u002Fspan>\n<span style=\"position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#e24c21\"><\u002Fspan>\n<span style=\"position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#efbfb6\"><\u002Fspan>\n<\u002Fspan>\n<article data-rc=\"0\" class=\"rc-step\" style=\"position:relative;flex:0 0 auto;width:clamp(280px,30vw,440px);padding-top:118px;box-sizing:border-box\" data-mrv=\"\">\n<span aria-hidden=\"true\" class=\"rc-num\" style=\"position:absolute;left:-10px;top:64px;font-family:'Red Hat Display',system-ui,sans-serif;font-style:italic;font-weight:300;font-size:12rem;line-height:1;letter-spacing:-.04em;color:rgba(249,246,239,.08);pointer-events:none;user-select:none\">01<\u002Fspan>\n<span data-rc-node=\"\" aria-hidden=\"true\" class=\"rc-node\" style=\"position:absolute;left:0;top:50px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#31140e;box-shadow:0 0 0 1.5px rgba(249,246,239,.45);transition:background-color .4s ease,box-shadow .4s ease\"><\u002Fspan>\n<div style=\"position:relative;display:grid;gap:12px\">\n<h3 style=\"margin:0;font-size:clamp(24px,2.2vw,32px);line-height:1.12;font-weight:600;letter-spacing:-.02em;color:#f9f6ef\">Primera consulta<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(235,228,211,.7);max-width:36ch;text-wrap:pretty\">El médico radioterapeuta evalúa tu caso y define si la radioterapia está indicada. Te explicamos cómo va a ser el recorrido y qué podés esperar.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article data-rc=\"1\" class=\"rc-step\" style=\"position:relative;flex:0 0 auto;width:clamp(280px,30vw,440px);padding-top:118px;box-sizing:border-box\" data-mrv=\"\">\n<span aria-hidden=\"true\" class=\"rc-num\" style=\"position:absolute;left:-10px;top:64px;font-family:'Red Hat Display',system-ui,sans-serif;font-style:italic;font-weight:300;font-size:12rem;line-height:1;letter-spacing:-.04em;color:rgba(249,246,239,.08);pointer-events:none;user-select:none\">02<\u002Fspan>\n<span data-rc-node=\"\" aria-hidden=\"true\" class=\"rc-node\" style=\"position:absolute;left:0;top:50px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#31140e;box-shadow:0 0 0 1.5px rgba(249,246,239,.45);transition:background-color .4s ease,box-shadow .4s ease\"><\u002Fspan>\n<div style=\"position:relative;display:grid;gap:12px\">\n<h3 style=\"margin:0;font-size:clamp(24px,2.2vw,32px);line-height:1.12;font-weight:600;letter-spacing:-.02em;color:#f9f6ef\">Comité de tumores<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(235,228,211,.7);max-width:36ch;text-wrap:pretty\">La indicación se discute y se valida en equipo. Tu médico derivador puede participar de esa discusión.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article data-rc=\"2\" class=\"rc-step\" style=\"position:relative;flex:0 0 auto;width:clamp(280px,30vw,440px);padding-top:118px;box-sizing:border-box\" data-mrv=\"\">\n<span aria-hidden=\"true\" class=\"rc-num\" style=\"position:absolute;left:-10px;top:64px;font-family:'Red Hat Display',system-ui,sans-serif;font-style:italic;font-weight:300;font-size:12rem;line-height:1;letter-spacing:-.04em;color:rgba(249,246,239,.08);pointer-events:none;user-select:none\">03<\u002Fspan>\n<span data-rc-node=\"\" aria-hidden=\"true\" class=\"rc-node\" style=\"position:absolute;left:0;top:50px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#31140e;box-shadow:0 0 0 1.5px rgba(249,246,239,.45);transition:background-color .4s ease,box-shadow .4s ease\"><\u002Fspan>\n<div style=\"position:relative;display:grid;gap:12px\">\n<h3 style=\"margin:0;font-size:clamp(24px,2.2vw,32px);line-height:1.12;font-weight:600;letter-spacing:-.02em;color:#f9f6ef\">Simulación<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(235,228,211,.7);max-width:36ch;text-wrap:pretty\">Una tomografía en la posición exacta en que vas a tratarte. Se definen los elementos de inmovilización y las marcas de referencia.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article data-rc=\"3\" class=\"rc-step\" style=\"position:relative;flex:0 0 auto;width:clamp(280px,30vw,440px);padding-top:118px;box-sizing:border-box\" data-mrv=\"\">\n<span aria-hidden=\"true\" class=\"rc-num\" style=\"position:absolute;left:-10px;top:64px;font-family:'Red Hat Display',system-ui,sans-serif;font-style:italic;font-weight:300;font-size:12rem;line-height:1;letter-spacing:-.04em;color:rgba(249,246,239,.08);pointer-events:none;user-select:none\">04<\u002Fspan>\n<span data-rc-node=\"\" aria-hidden=\"true\" class=\"rc-node\" style=\"position:absolute;left:0;top:50px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#31140e;box-shadow:0 0 0 1.5px rgba(249,246,239,.45);transition:background-color .4s ease,box-shadow .4s ease\"><\u002Fspan>\n<div style=\"position:relative;display:grid;gap:12px\">\n<h3 style=\"margin:0;font-size:clamp(24px,2.2vw,32px);line-height:1.12;font-weight:600;letter-spacing:-.02em;color:#f9f6ef\">Planificación<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(235,228,211,.7);max-width:36ch;text-wrap:pretty\">El equipo médico y de física médica reconstruye en tres dimensiones el tumor y los órganos vecinos, y calcula la dosis para tu caso.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article data-rc=\"4\" class=\"rc-step\" style=\"position:relative;flex:0 0 auto;width:clamp(280px,30vw,440px);padding-top:118px;box-sizing:border-box\" data-mrv=\"\">\n<span aria-hidden=\"true\" class=\"rc-num\" style=\"position:absolute;left:-10px;top:64px;font-family:'Red Hat Display',system-ui,sans-serif;font-style:italic;font-weight:300;font-size:12rem;line-height:1;letter-spacing:-.04em;color:rgba(249,246,239,.08);pointer-events:none;user-select:none\">05<\u002Fspan>\n<span data-rc-node=\"\" aria-hidden=\"true\" class=\"rc-node\" style=\"position:absolute;left:0;top:50px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#31140e;box-shadow:0 0 0 1.5px rgba(249,246,239,.45);transition:background-color .4s ease,box-shadow .4s ease\"><\u002Fspan>\n<div style=\"position:relative;display:grid;gap:12px\">\n<h3 style=\"margin:0;font-size:clamp(24px,2.2vw,32px);line-height:1.12;font-weight:600;letter-spacing:-.02em;color:#f9f6ef\">Sesiones<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(235,228,211,.7);max-width:36ch;text-wrap:pretty\">Antes de irradiar, se obtienen imágenes y se corrige tu posición. Un sistema de registro controla que cada sesión se administre conforme a lo planificado.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article data-rc=\"5\" class=\"rc-step\" style=\"position:relative;flex:0 0 auto;width:clamp(280px,30vw,440px);padding-top:118px;box-sizing:border-box\" data-mrv=\"\">\n<span aria-hidden=\"true\" class=\"rc-num\" style=\"position:absolute;left:-10px;top:64px;font-family:'Red Hat Display',system-ui,sans-serif;font-style:italic;font-weight:300;font-size:12rem;line-height:1;letter-spacing:-.04em;color:rgba(249,246,239,.08);pointer-events:none;user-select:none\">06<\u002Fspan>\n<span data-rc-node=\"\" aria-hidden=\"true\" class=\"rc-node\" style=\"position:absolute;left:0;top:50px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#31140e;box-shadow:0 0 0 1.5px rgba(249,246,239,.45);transition:background-color .4s ease,box-shadow .4s ease\"><\u002Fspan>\n<div style=\"position:relative;display:grid;gap:12px\">\n<h3 style=\"margin:0;font-size:clamp(24px,2.2vw,32px);line-height:1.12;font-weight:600;letter-spacing:-.02em;color:#f9f6ef\">Controles y seguimiento<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:rgba(235,228,211,.7);max-width:36ch;text-wrap:pretty\">Controles durante el curso del tratamiento y seguimiento posterior, con el mismo equipo y el mismo Referente.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rc-foot\" style=\"position:relative;display:flex;justify-content:center;padding:0 20px clamp(24px,5vh,48px)\">\n<div data-glass=\"dark\" style=\"display:flex;align-items:center;gap:16px;height:40px;padding:0 18px;border-radius:999px;background:rgba(249,246,239,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 10px 28px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)\">\n<span ref=\"{{ rcLabelRef }}\" aria-live=\"polite\" style=\"font-size:13px;font-weight:600;letter-spacing:.02em;color:#f9f6ef;white-space:nowrap;font-variant-numeric:tabular-nums\">Paso 1 de 6<\u002Fspan>\n<span style=\"position:relative;width:clamp(120px,18vw,220px);height:2px;border-radius:2px;background:rgba(249,246,239,.2);overflow:hidden\"><span ref=\"{{ rcBarRef }}\" style=\"position:absolute;inset:0;background:#e24c21;transform-origin:0 50%;transform:scaleX(0)\"><\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"referente\" ref=\"{{ rfRef }}\" data-nav=\"light\" aria-label=\"Referente del Paciente\" style=\"position:relative;background:#f9f6ef;padding:clamp(120px,16vw,200px) clamp(20px,5vw,72px)\">\n<div class=\"rf-grid\" style=\"max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(48px,7vw,112px);align-items:center\">\n<div style=\"display:grid;gap:24px;align-content:start\">\n\n<h2 data-rf-in=\"\" style=\"margin: 0; font-size: clamp(2.1rem,3.9vw,3.75rem); line-height: 1.05; letter-spacing: -.03em; font-weight: 400; color: #31140e; text-wrap: balance\" data-mrv=\"\">Desde el primer contacto hasta el alta, siempre hay alguien identificable del otro lado.<\u002Fh2>\n<p data-rf-in=\"\" style=\"margin:0;font-size:clamp(1.0625rem,1.4vw,1.25rem);line-height:1.55;color:#655146;max-width:50ch;text-wrap:pretty\">El <b>Referente del Paciente<\u002Fb> es una persona con nombre y apellido que acompaña tu caso. No es un servicio adicional: es parte de cómo entendemos la atención.<\u002Fp>\n<ul style=\"list-style:none;margin:12px 0 0;padding:0;display:grid;border-top:1px solid rgba(101,81,70,.22)\">\n<li data-rf-item=\"\" style=\"position:relative;display:flex;gap:18px;align-items:baseline;padding:20px 0;font-size:17px;line-height:1.55;color:#2c2a28\">\n<span data-rf-dash=\"\" aria-hidden=\"true\" style=\"flex:0 0 auto;width:14px;height:2px;border-radius:2px;background:#e24c21;transform:translateY(-4px)\"><\u002Fspan>\n<span data-rf-text=\"\">Recibe tu consulta inicial y te explica con claridad en qué consiste el tratamiento y qué implica en tu vida cotidiana.<\u002Fspan>\n<span data-rf-line=\"\" aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(101,81,70,.22);transform-origin:0 50%\"><\u002Fspan>\n<\u002Fli>\n<li data-rf-item=\"\" style=\"position:relative;display:flex;gap:18px;align-items:baseline;padding:20px 0;font-size:17px;line-height:1.55;color:#2c2a28\">\n<span data-rf-dash=\"\" aria-hidden=\"true\" style=\"flex:0 0 auto;width:14px;height:2px;border-radius:2px;background:#e24c21;transform:translateY(-4px)\"><\u002Fspan>\n<span data-rf-text=\"\">Gestiona la autorización ante tu obra social o prepaga.<\u002Fspan>\n<span data-rf-line=\"\" aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(101,81,70,.22);transform-origin:0 50%\"><\u002Fspan>\n<\u002Fli>\n<li data-rf-item=\"\" style=\"position:relative;display:flex;gap:18px;align-items:baseline;padding:20px 0;font-size:17px;line-height:1.55;color:#2c2a28\">\n<
